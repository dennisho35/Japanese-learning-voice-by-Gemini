plugins {
    id 'com.android.application'
}

android {
    namespace 'com.japanesestepbystep.hdvoice'
    compileSdk 34

    defaultConfig {
        // 使用獨立 applicationId 避免與舊版 APK 發生簽章或覆蓋衝突
        applicationId "com.japanesestepbystep.hdvoice"
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName "2.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
